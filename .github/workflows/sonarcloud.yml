name: SonarQube Cloud 

on: 

  push: 

    branches: [main] 

  pull_request: 

    types: [opened, synchronize, reopened] 

jobs: 

  sonarqube: 

    name: Analisis de calidad 

    runs-on: ubuntu-latest 

    steps: 

      - uses: actions/checkout@v5 

        with: 

          fetch-depth: 0   # SonarQube necesita el historial completo 

  

      - uses: actions/setup-node@v6 

        with: 

          node-version: 20 

  

      - run: npm ci 

  

      # Hay 2 pruebas que fallan a proposito: no debemos detener el flujo, 

      # porque necesitamos igual el reporte de cobertura. 
       - name: Pruebas con cobertura 

        run: npx jest --coverage 

        continue-on-error: true 

  

      - name: Analisis SonarQube Cloud 

        uses: SonarSource/sonarqube-scan-action@v6 

        env: 

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} 
